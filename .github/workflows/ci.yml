name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .
      - name: Type check (mypy)
        run: mypy src/codie
      - name: Test (pytest)
        env:
          CODIE_E2E: ""
        run: pytest tests -q

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'schedule' || (github.event_name == 'push' && vars.CODIE_RUN_E2E == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: E2E (gated; requires sandbox repo tokens)
        env:
          CODIE_E2E: "1"
        run: pytest tests/e2e -q